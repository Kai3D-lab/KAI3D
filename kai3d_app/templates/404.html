<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Página no encontrada - KAI 3D</title>
</head>
<body>
    <!-- La página 404 no existe!!! -->
    <!-- Página personalizada para errores 404 -->
    <h1>404 - Página no encontrada</h1>

    <p>La página que buscas no existe o ha sido movida.</p>

    <!-- Django utiliza el nombre de la URL para volver a la página de inicio -->
    <a href="{% url 'inicio' %}">Volver al inicio</a>

</body>
</html>
